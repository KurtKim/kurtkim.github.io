baseURL: https://kurtkim.github.io/
locale: ko-KR
defaultContentLanguage: ko
theme: PaperMod
title: K2H'log
pagination:
    pagerSize: 5
enableRobotsTXT: true
hasCJKLanguage: false

permalinks:
    post: /p/:slug/
    page: /:slug/

outputs:
    home:
        - HTML
        - RSS
        - JSON

params:
    mainSections:
        - post
    description: 넓고 얕은 지식을 위한
    DateFormat: Jan 02, 2006
    defaultTheme: auto
    ShowReadingTime: true
    ShowFullTextinRSS: true
    showtoc: true
    comments: true
    utterances:
        repo: KurtKim/kurtkim.github.io
        issueTerm: pathname
    assets:
        favicon: favicon.png
    label:
        icon: img/k2h.jpg
    homeInfoParams:
        Title: K2H'log
        Content: 넓고 얕은 지식을 위한
    socialIcons:
        - name: github
          url: https://github.com/kurtkim/
        - name: linkedin
          url: https://www.linkedin.com/in/kyeong-hun-kim-430ba075/
        - name: instagram
          url: https://www.instagram.com/kurt_k2h/
        - name: velog
          url: https://velog.io/@kurt_kim

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: false
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4
